apply plugin: 'com.android.application'

android {
    compileSdkVersion 31
    archivesBaseName = "GiantStopwatch"
    defaultConfig {
        applicationId "omegacentauri.mobi.simplestopwatch"
        minSdkVersion 4
        targetSdkVersion 31
        // CI passes -PappVersionCode=<run number> so each build is installable over the last
        // and always sorts above the static baseline below; local/manual builds use the baseline
        versionCode project.hasProperty('appVersionCode') ? (1054 + project.appVersionCode.toInteger()) : 1054
        versionName "1.54"
    }
    signingConfigs {
        debug {
            // fixed debug keystore (checked in, standard debug credentials) so every build -
            // local or CI - signs identically and can always be installed over a previous one
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    //implementation 'com.android.support:appcompat-v7:27.1.1'
    //implementation 'com.android.support.constraint:constraint-layout:1.0.2'
//    testImplementation 'junit:junit:4.12'
//    androidTestImplementation 'com.android.support.test:runner:1.0.1'
//    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}
